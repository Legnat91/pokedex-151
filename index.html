<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÓKEDEX</title>
    <link rel="shortcut icon" href="./img/" type="image/x-icon">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="shortcut icon" href="./img/pokedex.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style/style.css">

</head>

<body>
    <header id="cabecera" class="flex flex-col items-center text-center py-4 bg-red-600 gap-4">
        <h1 class="text-5xl md:text-8xl font-bold text-yellow-500 text-shadow [text-shadow:_2px_2px_2px_#6390F0]">
            <img src="./img/titulo.png" class="w-xs"></img>
        </h1>
        <nav id="nav-tipos" class="flex flex-wrap gap-2 justify-center"></nav>
        <input type="text" name="buscadorPokemon" id="buscadorPokemon" placeholder="Buscar Pokemon"
            class="bg-white  w-xs md:w-xl  xl:w-2xl md:h-10 px-2 rounded">
    </header>
    <main id="pokedex" class="bg-gradient-to-br from-blue-400 via-blue-200 to-blue-100 min-h-screen pt-4">

        <ul id="skeleton-pokemon" class="flex flex-wrap items-center justify-center "></ul>
        <ul id="lista-pokemon" class="gap md:flex md:flex-wrap items-center justify-center"></ul>
        <div id="mensaje-no-encontrado" class="flex items-center justify-center text-xl text-white mt-10 hidden w-full">
            <img src="./img/nofound.png" alt="">
        </div>
        <a href="#"
            class="fixed bottom-4 right-4 bg-red-500 text-white p-4 rounded-full shadow-lg hover:bg-red-700 transition-all duration-300">
            ↑
        </a>
        <div id="final-scroll" class="h-10"></div>
    </main>
    <footer></footer>
    <script type="module" src="./js/app.js"></script>
</body>

</html>
